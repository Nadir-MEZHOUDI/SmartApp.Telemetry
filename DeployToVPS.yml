trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  validationSolution: 'Telemetry.CI.slnf'
  packageOutput: '$(Build.ArtifactStagingDirectory)/nuget'
  vpsComposeFile: 'docker-compose.yml'
  vpsRoot: '/opt/smartapp-telemetry'
  imageRepository: 'nadir-mezhoudi/smartapp-telemetry'

stages:
- stage: BuildAndPush
  displayName: Build & Push
  jobs:
  - job: ValidateAndPackage
    displayName: Validate solution and publish Client package
    steps:
    - checkout: self

    - task: DotNetCoreCLI@2
      displayName: Restore deployable projects
      inputs:
        command: restore
        projects: '$(validationSolution)'

    - task: DotNetCoreCLI@2
      displayName: Build deployable projects
      inputs:
        command: build
        projects: '$(validationSolution)'
        arguments: '--configuration $(buildConfiguration) --no-restore -p:GeneratePackageOnBuild=false'

    - task: DotNetCoreCLI@2
      displayName: Test deployable projects
      inputs:
        command: test
        projects: '$(validationSolution)'
        arguments: '--configuration $(buildConfiguration) --no-build --no-restore --collect:"XPlat Code Coverage"'

    - script: dotnet tool install --global dotnet-ef
      displayName: Install dotnet-ef

    - script: dotnet ef migrations has-pending-model-changes --project src/SmartApp.Telemetry.Infrastructure --startup-project src/SmartApp.Telemetry.Web
      displayName: Check EF migrations are up to date

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
        failIfCoverageEmpty: false

    - task: DotNetCoreCLI@2
      displayName: Pack SmartApp.Telemetry.Client
      inputs:
        command: pack
        packagesToPack: clients/SmartApp.Telemetry.Client/SmartApp.Telemetry.Client.csproj
        configuration: '$(buildConfiguration)'
        nobuild: true
        packDirectory: '$(packageOutput)'
        versioningScheme: off

    - task: PublishBuildArtifacts@1
      displayName: Publish Client package artifact
      inputs:
        PathtoPublish: '$(packageOutput)'
        ArtifactName: SmartApp.Telemetry.Client
        publishLocation: Container

  - job: BuildPush
    displayName: Build and push Web image to GHCR
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Login GHCR
      inputs:
        command: login
        containerRegistry: 'ghcr-login'

    - task: Docker@2
      displayName: Build and push Web image
      inputs:
        command: buildAndPush
        repository: '$(imageRepository)'
        dockerfile: '$(Build.SourcesDirectory)/src/SmartApp.Telemetry.Web/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          latest
          $(Build.BuildNumber)

- stage: Deploy
  displayName: Deploy to VPS
  dependsOn:
  - BuildAndPush
  condition: succeeded()
  jobs:
  - job: DeployVps
    displayName: SSH deploy
    steps:
    - task: SSH@0
      displayName: Pull and start Compose stack
      inputs:
        sshEndpoint: 'vps-ssh'
        runOptions: inline
        inline: |-
          set -e
          cd $(vpsRoot)
          docker network ls | grep -q "shared-net" || docker network create shared-net
          (docker compose -f $(vpsComposeFile) pull) 2>&1
          (docker compose -f $(vpsComposeFile) up -d --remove-orphans) 2>&1
          (docker compose -f $(vpsComposeFile) ps) 2>&1
