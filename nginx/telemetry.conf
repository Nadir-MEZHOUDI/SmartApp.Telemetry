# Only forward Cloudflare-injected headers when the request actually passed through Cloudflare.
# Cloudflare strips client-supplied CF-* headers, so these values are trustworthy.
map $http_cf_connecting_ip $cf_country {
    ""      "";
    default $http_cf_ipcountry;
}

map $http_cf_connecting_ip $cf_connecting_ip {
    ""      "";
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name telemetry.smartappdz.org;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $cf_country;
        proxy_set_header CF-Connecting-IP $cf_connecting_ip;
    }
}
