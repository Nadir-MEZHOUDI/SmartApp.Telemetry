name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Telemetry.sln

      - name: Build
        run: dotnet build Telemetry.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Telemetry.sln --configuration Release --no-build --no-restore
