name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Telemetry.sln

    - name: Build
      run: dotnet build Telemetry.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Telemetry.sln --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef

    - name: Check EF migrations are up to date
      run: dotnet ef migrations has-pending-model-changes --project src/SmartApp.Telemetry.Infrastructure --startup-project src/SmartApp.Telemetry.Web

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: TestResults/
        if-no-files-found: ignore
