name: Publish NuGet Package

on:
  push:
    branches:
      - main
    paths:
      - 'clients/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, test, and publish to nuget.org
    runs-on: ubuntu-latest

    env:
      clientProject: clients/SmartApp.Telemetry.Client/SmartApp.Telemetry.Client.csproj
      clientTestProject: tests/SmartApp.Telemetry.Client.Tests/SmartApp.Telemetry.Client.Tests.csproj
      packageOutput: ${{ runner.temp }}/nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.clientTestProject }}

      - name: Build
        run: dotnet build ${{ env.clientProject }} --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test ${{ env.clientTestProject }} --configuration Release --no-restore

      - name: Pack SmartApp.Telemetry.Client
        run: dotnet pack ${{ env.clientProject }} --configuration Release --no-build --output ${{ env.packageOutput }} -p:PackageOutputPath=${{ env.packageOutput }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ${{ env.packageOutput }}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
