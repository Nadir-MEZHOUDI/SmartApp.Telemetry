trigger:
- main

pool:
  # NuGetCommand@2 uses NuGet.exe for external API-key authentication.
  # Keep this on an image supported by that task; ubuntu-latest may move to 24.04.
  vmImage: ubuntu-22.04

variables:
  clientProject: 'clients/SmartApp.Telemetry.Client/SmartApp.Telemetry.Client.csproj'
  clientTestProject: 'tests/SmartApp.Telemetry.Client.Tests/SmartApp.Telemetry.Client.Tests.csproj'
  buildConfiguration: 'Release'
  nugetServiceConnection: 'nuget-org'

steps:
- task: DotNetCoreCLI@2
  displayName: dotnet restore
  inputs:
    command: restore
    projects: '$(clientTestProject)'

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    command: build
    projects: '$(clientProject)'
    arguments: '--configuration $(buildConfiguration) -p:GeneratePackageOnBuild=false'

- task: DotNetCoreCLI@2
  displayName: dotnet pack SmartApp.Telemetry.Client
  inputs:
    command: pack
    packagesToPack: '$(clientProject)'
    configuration: '$(buildConfiguration)'
    nobuild: true
    arguments: '--output $(Build.ArtifactStagingDirectory) -p:PackageOutputPath=$(Build.ArtifactStagingDirectory)'

- task: DotNetCoreCLI@2
  displayName: push to Azure Artifacts
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
    nuGetFeedType: internal
    publishVstsFeed: '1ed0d063-2001-4386-82a2-66c01ee046b2'
    allowPackageConflicts: true
    publishPackageMetadata: false

- task: NuGetCommand@2
  displayName: push to nuget.org
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
    nuGetFeedType: external
    publishFeedCredentials: '$(nugetServiceConnection)'

- task: PublishBuildArtifacts@1
  displayName: publish NuGet artifact
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SmartApp.Telemetry.Client'
    publishLocation: Container
