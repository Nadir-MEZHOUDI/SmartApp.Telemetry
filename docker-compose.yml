services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - telemetry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ConnectionStrings__Telemetry: Host=postgres;Port=5432;Database=telemetry;Username=telemetry;Password=change-this-password
      Dashboard__AdminKey: change-this-admin-key
      TelemetryApi__BaseUrl: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  telemetry-postgres:
