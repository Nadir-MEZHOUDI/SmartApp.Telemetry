name: SmartApp.Telemetry

services:
  web:
    image: ghcr.io/nadir-mezhoudi/smartapp-telemetry:latest
    build:
      context: .
      dockerfile: src/SmartApp.Telemetry.Web/Dockerfile
    container_name: smartapp-telemetry-web
    ports:
      - "127.0.0.1:${TELEMETRY_WEB_PORT:-8091}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Telemetry: ${ConnectionStrings__Telemetry:?Set ConnectionStrings__Telemetry in .env}
      Dashboard__AdminKey: ${DASHBOARD_ADMIN_KEY:?Set DASHBOARD_ADMIN_KEY in .env}
      Dashboard__Password: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
      TelemetryApi__BaseUrl: http://localhost:8080
    networks:
      - shared-net
    user: "0:0"
    volumes:
      - telemetry-dpkeys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  telemetry-dpkeys:

networks:
  shared-net:
    external: true
